<main>
<section id="enquiry">

<div class="container">

<div class="title">
<h2>📝 Get a Free Quote</h2>
<p>Apni requirement bhejiye, WhatsApp par enquiry karein</p>
</div>

<div class="enquiry">

<div class="form-grid">

<div class="form-group">
<label>Your Name</label>
<input type="text" id="name" placeholder="Apna naam">
</div>

<div class="form-group">
<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="Mobile number">
</div>

<div class="form-group">
<label>Camera Quantity</label>

<select id="quantity">
<option value="">Select Quantity</option>
<option>4 Camera</option>
<option>8 Camera</option>
<option>16 Camera</option>
<option>20+ Camera</option>
</select>

</div>

<div class="form-group">
<label>Camera Type</label>

<select id="type">
<option value="">Select Camera Type</option>
<option>IP Camera</option>
<option>HD Camera</option>
<option>Wi-Fi Camera</option>
<option>4G Camera</option>
<option>PTZ Camera</option>
<option>Repairing</option>
<option>DVR / NVR Repairing</option>
</select>

</div>

<div class="form-group form-full">

<label>Your Requirement</label>

<textarea id="message"
placeholder="Installation, repairing, price ya package ke baare mein batayein..."></textarea>

</div>
<div class="form-group form-full">

<label>📍 Customer Address / Location</label>

<textarea id="address"
placeholder="Apna poora address likhein...&#10;Jaise: Daurala, Meerut"></textarea>

<button type="button"
class="btn mapbtn"
style="width:100%;margin-top:10px"
onclick="getLocation()">
📍 Send My Current Location
</button>

<p id="locationStatus"
style="color:#aaa;margin-top:8px;text-align:center">

</p>

</div>
</div>

<button class="btn green"
style="border:0;width:100%;margin-top:5px"
onclick="sendEnquiry()">
💬 Send Enquiry on WhatsApp
</button>

</div>
</div>
