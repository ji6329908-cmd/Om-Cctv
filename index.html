<script>

let customerLocation = "";

function getLocation() {
    const status = document.getElementById("locationStatus");

    if (!navigator.geolocation) {
        status.textContent = "❌ Is browser me location support nahi hai.";
        return;
    }

    status.textContent = "📍 Location li ja rahi hai...";

    navigator.geolocation.getCurrentPosition(
        function(position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            customerLocation =
                "https://www.google.com/maps?q=" + lat + "," + lng;

            status.textContent = "✅ Current location ready hai.";
        },

        function(error) {

            customerLocation = "";

            status.textContent =
                "❌ Location permission allow karein.";
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}


function sendEnquiry() {

    let name =
        document.getElementById("name").value.trim();

    let mobile =
        document.getElementById("mobile").value.trim();

    let quantity =
        document.getElementById("quantity").value;

    let type =
        document.getElementById("type").value;

    let message =
        document.getElementById("message").value.trim();

    let address =
        document.getElementById("address").value.trim();


    if (name === "") {

        alert("Please apna naam enter karein.");

        return;
    }


    if (mobile === "") {

        alert("Please mobile number enter karein.");

        return;
    }


    if (type === "") {

        alert("Please Camera Type / Service select karein.");

        return;
    }


    let text =
        "Namaste 🙏 OM CCTV,%0A%0A" +

        "Mujhe CCTV ke baare mein enquiry karni hai.%0A%0A" +

        "👤 Name: " +
        encodeURIComponent(name) +
        "%0A" +

        "📞 Mobile: " +
        encodeURIComponent(mobile) +
        "%0A" +

        "📹 Camera Quantity: " +
        encodeURIComponent(
            quantity || "Not selected"
        ) +
        "%0A" +

        "📷 Camera Type / Service: " +
        encodeURIComponent(type) +
        "%0A" +

        "📍 Customer Address: " +
        encodeURIComponent(
            address || "Address nahi diya"
        ) +
        "%0A";


    if (customerLocation !== "") {

        text +=

            "🗺️ Google Maps Location:%0A" +

            encodeURIComponent(
                customerLocation
            ) +

            "%0A";
    }


    text +=

        "📝 Requirement: " +

        encodeURIComponent(
            message ||
            "Price aur details chahiye."
        ) +

        "%0A%0A" +

        "Please mujhe price aur details bataiye.";


    window.open(

        "https://wa.me/917060727266?text=" +
        text,

        "_blank"
    );
}

</script>
